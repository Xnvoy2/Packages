# Builds the package identity program on Linux, because it cannot be built on
# the Windows machine this project is developed on: Anchor's proc-macro build
# scripts compile for the host, that host toolchain is MSVC, and there is no
# MSVC linker available.
#
# This workflow builds and tests. It does not deploy. Nothing here holds a
# key, touches a cluster, or spends anything.
#
# Versions are pinned to what the existing source already requires rather than
# upgraded: Cargo.lock pins anchor-lang 0.30.1, so the CLI matches it, and the
# Solana and Rust versions are the ones that toolchain was built against.

name: Solana program build

on:
  workflow_dispatch:
  push:
    branches: [privy-wip]
    paths:
      - "solana/**"
      - ".github/workflows/solana-build.yml"

permissions:
  contents: read

env:
  SOLANA_VERSION: "1.18.26"
  ANCHOR_VERSION: "0.30.1"
  # Two toolchains, because the two halves want different compilers.
  # Anchor CLI 0.30.1 pulls an old "time" that fails to compile on 1.85
  # (E0282), while the program's committed Cargo.lock pins toml_parser 1.1.3,
  # which needs edition2024 and so will not build below 1.85. Installing the
  # CLI on the old compiler and building the program on the new one satisfies
  # both without editing the project's lockfile.
  RUST_CLI_VERSION: "1.79.0"
  RUST_BUILD_VERSION: "1.85.0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_CLI_VERSION" --profile minimal
          rustup toolchain install "$RUST_BUILD_VERSION" --profile minimal
          rustup default "$RUST_BUILD_VERSION"
          rustc --version && cargo --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            solana/target
          key: ${{ runner.os }}-anchor-${{ env.ANCHOR_VERSION }}-r${{ env.RUST_BUILD_VERSION }}-${{ hashFiles('solana/Cargo.lock') }}

      - name: Install Solana toolchain
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Check Solana toolchain
        run: |
          solana --version
          cargo-build-sbf --version

      - name: Install Anchor CLI
        run: |
          rustup run "$RUST_CLI_VERSION" cargo install \
            --git https://github.com/coral-xyz/anchor \
            --tag "v${ANCHOR_VERSION}" anchor-cli --locked --force
          anchor --version

      # The program's own unit tests, which run on the host rather than SBF.
      - name: Rust tests
        working-directory: solana
        # From the workspace root and --locked, so the committed Cargo.lock is
        # honoured. Pointing cargo at the program manifest instead re-resolves
        # every transitive dependency to its newest version, which pulls in
        # crates that now require edition2024 and will not build on this
        # toolchain. The lock is what pins this program to versions it is
        # known to compile against.
        run: cargo test --locked -p package-identity -- --nocapture

      - name: Build the program
        working-directory: solana
        run: anchor build -- --locked

      # A build that "succeeds" without producing an object is not a build.
      - name: Verify the artifact
        working-directory: solana
        run: |
          SO="target/deploy/package_identity.so"
          if [ ! -f "$SO" ]; then
            echo "no .so was produced at $SO"
            ls -R target/deploy || true
            exit 1
          fi
          echo "SBF BUILD: PASS"
          echo "ARTIFACT: solana/$SO"
          echo "SIZE: $(stat -c%s "$SO") bytes"
          echo "SHA256: $(sha256sum "$SO" | cut -d' ' -f1)"

      # What the compiled program believes its own address is, read back from
      # the IDL rather than trusted from the source.
      - name: Report the program id
        working-directory: solana
        run: |
          echo "declared in source:"
          grep -o 'declare_id!("[^"]*")' programs/package_identity/src/lib.rs || true
          if [ -f target/idl/package_identity.json ]; then
            echo "idl address: $(grep -o '"address": *"[^"]*"' target/idl/package_identity.json | head -1)"
          fi
          # anchor build writes a keypair here when none exists. It is NOT the
          # declared id, and it is deliberately not published as an artifact:
          # deploying would need a key, and which key that is, is a decision
          # for a human, not a side effect of a build.
          if [ -f target/deploy/package_identity-keypair.json ]; then
            echo "build-generated keypair pubkey: $(solana-keygen pubkey target/deploy/package_identity-keypair.json)"
            echo "(generated by the build because no keypair is committed; not retained)"
          fi

      - name: Upload the program
        uses: actions/upload-artifact@v4
        with:
          name: package-identity-sbf
          path: |
            solana/target/deploy/package_identity.so
            solana/target/idl/package_identity.json
          if-no-files-found: error
          retention-days: 14
